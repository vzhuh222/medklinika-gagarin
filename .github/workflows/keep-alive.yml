# Будит бесплатный сервис Render, чтобы он не засыпал через 15 минут простоя.
name: Keep site awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping production URLs
        run: |
          set -e
          curl -fsS --retry 3 --retry-all-errors --max-time 90 \
            "https://medclinika-gagarin.ru/health"
          echo
          curl -fsS --retry 3 --retry-all-errors --max-time 90 \
            "https://medklinika-gagarin.onrender.com/health"
          echo
