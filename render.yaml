# Бесплатный демо-хостинг без банковской карты.
# База — SQLite внутри сервиса (без Render Postgres: именно он раньше просил карту).
# Деплой: https://render.com/deploy?repo=https://github.com/vzhuh222/medklinika-gagarin

services:
  - type: web
    name: medklinika-gagarin
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEDFLEX_ENABLED
        value: "false"
      - key: PD_OPERATOR_NAME
        value: МедКлиника на Гагарина
      - key: PD_DPO_EMAIL
        value: privacy@medklinika-gagarin.ru
      - key: ONEC_ORG_NAME
        value: МедКлиника на Гагарина
