<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход для сотрудников — МедКлиника на Гагарина</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png" type="image/png">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__logo">
        <a href="/"><img src="/assets/logo.png" alt="МедКлиника"></a>
      </div>
      <h1 class="auth-card__title">Вход для сотрудников</h1>
      <p class="auth-card__subtitle">Доступ для врачей и администрации клиники</p>

      <div class="form-message" id="formMessage"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="email@medklinika.ru">
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%;">Войти</button>
      </form>

      <div class="auth-card__footer">
        <a href="/">← На главную</a>
      </div>

      <div style="margin-top:24px;padding:12px;background:var(--bg-alt);border-radius:var(--radius);font-size:12px;color:var(--text-muted);">
        <strong>Тестовые аккаунты:</strong><br>
        Админ: admin@medklinika.ru / admin123<br>
        Врач: smirnova@medklinika.ru / doctor123
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('formMessage');
      msg.className = 'form-message';
      msg.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/admin.html';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'form-message error';
      }
    });
  </script>
</body>
</html>
